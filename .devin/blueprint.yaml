# BetterJoy2: compile-check environment on Linux.
# The app is Windows-only (WinForms + WinRT), but it compiles on Linux with
# EnableWindowsTargeting once the local NuGet sources and native stubs exist.
initialize: |
  # .NET 10 SDK
  curl -sSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
  chmod +x /tmp/dotnet-install.sh
  /tmp/dotnet-install.sh --channel 10.0 --install-dir $HOME/.dotnet
  echo 'PATH=$HOME/.dotnet:$PATH' >> $ENVRC
  export PATH=$HOME/.dotnet:$PATH

  # thirdparty submodules (ViGEm.NET, WindowsInput, hidapi)
  git submodule update --init --recursive

  # Local NuGet source dirs + native binary stubs (only needed to satisfy
  # copy/embed steps during compile-check; real binaries require MSVC).
  mkdir -p thirdparty/ViGEm.NET/bin \
          thirdparty/WindowsInput/WindowsInput/bin/Release \
          thirdparty/ViGEm.NET/ViGEmClientNative/bin/release/x86 \
          thirdparty/ViGEm.NET/ViGEmClientNative/bin/release/x64 \
          thirdparty/hidapi/windows/Win32/Release \
          thirdparty/hidapi/windows/x64/Release
  echo stub > thirdparty/ViGEm.NET/ViGEmClientNative/bin/release/x86/ViGEmClient.dll
  echo stub > thirdparty/ViGEm.NET/ViGEmClientNative/bin/release/x64/ViGEmClient.dll
  echo stub > thirdparty/hidapi/windows/Win32/Release/hidapi.dll
  echo stub > thirdparty/hidapi/windows/x64/Release/hidapi.dll
  touch "dist/Drivers/ViGEmBus_1.22.0_x64_x86_arm64.exe" \
        "dist/Drivers/HidHide_1.5.230_x64.exe"

  # Local packages consumed as NuGet sources by nuget.config
  dotnet build thirdparty/ViGEm.NET/ViGEmClient/ViGEmClient.NET.csproj -c Release
  dotnet build thirdparty/WindowsInput/WindowsInput/WindowsInput.csproj -c Release -p:EnableWindowsTargeting=true

knowledge:
  - name: build
    contents: |
      dotnet build BetterJoy/BetterJoy.csproj -p:EnableWindowsTargeting=true
      # Compile-only check on Linux; the app cannot run here (Windows-only
      # WinForms + ViGEmBus). Native DLLs are stubs.
  - name: notes
    contents: |
      net10.0-windows10.0.22621.0 + WinForms; TreatWarningsAsErrors is on.
      dotnet lives at ~/.dotnet/dotnet (install script adds it via $ENVRC).
